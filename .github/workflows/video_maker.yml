name: Generate Video
on:
  repository_dispatch:
    types: [create-video]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          
      - name: Run Video Script
      env:
        IMAGE_URL: ${{ github.event.client_payload.image_url }}
        AUDIO_URL: ${{ github.event.client_payload.audio_url }}
        CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
        POST_TITLE: ${{ github.event.client_payload.post_title }}
      run: python main.py
